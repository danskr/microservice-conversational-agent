[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "order-fulfillment-conversational-agent"
version = "1.0.0"
description = "LangGraph conversational layer for the Order Fulfillment REST microservice"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.1,<2",
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph-cli[inmem]>=0.4.30,<0.5",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"
