discrepancies_and_implementation_notes:
- id: DISC-001
  severity: low
  subject: cancel delivered error specificity
  finding: cancel_order checks any shipped_qty > 0 before checking Order.status == DELIVERED. In a consistent delivered order,
    shipped_qty is necessarily > 0, so ORDER_ALREADY_SHIPPED is expected before ORDER_ALREADY_DELIVERED.
  runtime_guidance: Treat both as cancellation-ineligible and recommend returns after delivery; do not rely on ORDER_ALREADY_DELIVERED
    being emitted.
- id: DISC-002
  severity: medium
  subject: duplicate return lines
  finding: Shipment creation explicitly rejects duplicate order_item_id lines, but create_return has no equivalent duplicate-line
    guard. Duplicate lines in one return request could bypass the intended per-item available quantity calculation because
    each line is validated before the new ReturnItems exist.
  runtime_guidance: Normalize return request items by order_item_id and merge quantities before invoking create_return.
- id: DISC-003
  severity: informational
  subject: partial shipment then new allocation
  finding: allocate_inventory accepts only PAID or PARTIALLY_ALLOCATED. create_shipment changes a partially fulfilled order
    to PARTIALLY_SHIPPED. Therefore v1 cannot allocate newly available inventory after an order has entered PARTIALLY_SHIPPED.
  runtime_guidance: Do not plan allocate_inventory from PARTIALLY_SHIPPED; explain this v1 service limitation.
- id: DISC-004
  severity: informational
  subject: inventory adjustment reason not audited
  finding: InventoryAdjustment requires a reason, but adjust_inventory does not persist or emit that reason.
  runtime_guidance: Do not claim that inventory adjustment reasons are auditable in v1.
analysis_quality:
  overall_confidence: high
  basis:
  - all Python source modules
  - all FastAPI routers
  - checked-in OpenAPI 3.1 contract
  - service metadata
  - business/architecture/API/deployment docs
  - workflow tests
  - Kubernetes manifests
  - seed data
  known_gaps:
  - No authentication/authorization semantics exist in v1.
  - No external payment or carrier behavior exists; those are simulated.
  - OpenAPI does not enumerate stable BusinessError response codes per operation, so error mapping is derived from implementation.
  runtime_agent_requirements:
  - Load only this digest plus environment-specific base URL/credentials if any are added later.
  - Use operations as an allowlist.
  - Use api_contract.schemas for request validation and operations.*.contract for HTTP construction.
  - Use business rules/state machines/workflows for planning and explanation.
  - Use evidence/discrepancies when explaining confidence or implementation limitations.
