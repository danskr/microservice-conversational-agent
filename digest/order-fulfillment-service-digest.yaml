      idempotency: 'yes'
    conversation_hints:
    - show shipment
    - tracking details
  mark_shipment_delivered:
    purpose: Mark a shipment delivered and, if all required units are shipped and all shipments are delivered, mark the order
      DELIVERED.
    http:
      method: POST
      path: /shipments/{shipment_id}/mark-delivered
    contract:
      openapi_operation_id: mark_delivered_shipments__shipment_id__mark_delivered_post
      summary: Mark shipment delivered
      tags:
      - shipments
      parameters:
      - name: shipment_id
        in: path
        required: true
        schema:
          type: string
          title: Shipment Id
      request_body: null
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    entities:
    - Shipment
    - Order
    preconditions:
    - shipment must exist
    postconditions:
    - shipment status becomes DELIVERED
    - delivered_at is set when transitioning
    - order becomes DELIVERED only when shipped quantity equals required non-cancelled quantity and every order shipment is
      DELIVERED
    side_effects:
    - creates SHIPMENT_DELIVERED event on first transition
    - may create ORDER_DELIVERED event
    errors:
    - SHIPMENT_NOT_FOUND
    execution:
      effect: state_change
      risk: high
      confirmation: required
      idempotency: yes; already DELIVERED shipment is returned unchanged
    conversation_hints:
    - mark package delivered
    - shipment arrived
    - complete delivery
  list_returns:
    purpose: List return requests for an order by requested_at.
    http:
      method: GET
      path: /orders/{order_id}/returns
    contract:
      openapi_operation_id: list_returns_orders__order_id__returns_get
      summary: List returns for order
      tags:
      - returns
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          title: Order Id
      request_body: null
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReturnOut'
                title: Response List Returns Orders  Order Id  Returns Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    entities:
    - Order
    - ReturnRequest
    - ReturnItem
    preconditions:
    - order must exist
    postconditions: []
    side_effects: []
    errors:
    - ORDER_NOT_FOUND
    execution:
      effect: read_only
      risk: low
      confirmation: never
      idempotency: 'yes'
    conversation_hints:
    - show returns
    - return requests for order
  create_return:
    purpose: Request return of delivered and eligible order-item quantities within the return window.
    http:
      method: POST
      path: /orders/{order_id}/returns
    contract:
      openapi_operation_id: create_return_orders__order_id__returns_post
      summary: Request return for delivered items
      tags:
      - returns
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          title: Order Id
      request_body:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    entities:
    - Order
    - OrderItem
    - Product
    - Shipment
    - ReturnRequest
    - ReturnItem
    preconditions:
    - order must exist
    - payment_status must be CAPTURED or PARTIALLY_REFUNDED
    - each referenced item must belong to the order
    - product must be returnable
    - quantity must not exceed delivered minus already returned minus pending REQUESTED/APPROVED quantity
    - at least one delivered quantity must exist for each line
    - request must be within 30 days of the latest delivered shipment containing that order item
    postconditions:
    - ReturnRequest starts REQUESTED
    - ReturnItem records are created
    side_effects:
    - creates RETURN_REQUESTED event
    errors:
    - ORDER_NOT_FOUND
    - PAYMENT_NOT_ELIGIBLE
    - ORDER_ITEM_NOT_FOUND
    - PRODUCT_NOT_RETURNABLE
    - RETURN_QUANTITY_EXCEEDED
    - NOTHING_DELIVERED
    - RETURN_WINDOW_EXPIRED
    - REQUEST_VALIDATION_ERROR
    execution:
      effect: state_change
      risk: medium
      confirmation: required
      idempotency: 'no'
    conversation_hints:
    - return item
    - return damaged monitor
    - send product back
    implementation_notes:
    - The implementation does not explicitly reject duplicate order_item_id entries within the same ReturnCreate request.
      A conversational executor should normalize/merge duplicate return lines before invocation.
    - The 30-day window is measured from the maximum delivered_at timestamp for shipments containing the item, which effectively
      uses the latest delivery when an item was delivered in multiple shipments.
  get_return:
    purpose: Retrieve a return request and its return lines.
    http:
      method: GET
      path: /returns/{return_id}
    contract:
      openapi_operation_id: get_return_returns__return_id__get
      summary: Get return
      tags:
      - returns
      parameters:
      - name: return_id
        in: path
        required: true
        schema:
          type: string
          title: Return Id
      request_body: null
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    entities:
    - ReturnRequest
    - ReturnItem
    preconditions:
    - return must exist
    postconditions: []
    side_effects: []
    errors:
    - RETURN_NOT_FOUND
    execution:
      effect: read_only
      risk: low
      confirmation: never
      idempotency: 'yes'
    conversation_hints:
    - show return
    - return status
  approve_return:
    purpose: Approve a REQUESTED return.
    http:
      method: POST
      path: /returns/{return_id}/approve
    contract:
      openapi_operation_id: approve_returns__return_id__approve_post
      summary: Approve requested return
      tags:
      - returns
      parameters:
      - name: return_id
        in: path
        required: true
        schema:
          type: string
          title: Return Id
      request_body: null
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    entities:
    - ReturnRequest
    - Order
    preconditions:
    - return must exist
    - return status must be REQUESTED
    postconditions:
    - return status becomes APPROVED
    - approved_at is set
    side_effects:
    - creates RETURN_APPROVED event
    errors:
    - RETURN_NOT_FOUND
    - INVALID_RETURN_STATE
    execution:
      effect: state_change
      risk: medium
      confirmation: required
      idempotency: no; repeat call is rejected
    conversation_hints:
    - approve return
    - authorize return
  reject_return:
    purpose: Reject a REQUESTED return with a reason.
    http:
      method: POST
      path: /returns/{return_id}/reject
    contract:
      openapi_operation_id: reject_returns__return_id__reject_post
      summary: Reject requested return
      tags:
      - returns
      parameters:
      - name: return_id
        in: path
        required: true
        schema:
          type: string
          title: Return Id
      request_body:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectReturnRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    entities:
    - ReturnRequest
    - Order
    preconditions:
    - return must exist
    - return status must be REQUESTED
    postconditions:
    - return status becomes REJECTED
    side_effects:
    - creates RETURN_REJECTED event containing rejection reason
    errors:
    - RETURN_NOT_FOUND
    - INVALID_RETURN_STATE
    - REQUEST_VALIDATION_ERROR
    execution:
      effect: destructive
      risk: medium
      confirmation: required
      idempotency: no; repeat call is rejected
    conversation_hints:
    - reject return
    - deny return request
  receive_return:
    purpose: Receive an APPROVED return and restock all returned quantities.
    http:
      method: POST
      path: /returns/{return_id}/receive
    contract:
      openapi_operation_id: receive_returns__return_id__receive_post
      summary: Receive approved return and restock inventory
      tags:
      - returns
      parameters:
      - name: return_id
        in: path
        required: true
        schema:
          type: string
          title: Return Id
      request_body: null
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    entities:
    - ReturnRequest
    - ReturnItem
    - OrderItem
    - Product
    preconditions:
    - return must exist
    - return status must be APPROVED
    postconditions:
    - each OrderItem.returned_qty increases by return quantity
    - each Product.stock_on_hand increases by return quantity
    - return status becomes RECEIVED
    - received_at is set
    side_effects:
    - restocks physical inventory
    - creates RETURN_RECEIVED event
    errors:
    - RETURN_NOT_FOUND
    - INVALID_RETURN_STATE
    execution:
      effect: state_change
      risk: high
      confirmation: required
      idempotency: no; repeat call is rejected
    conversation_hints:
    - receive returned goods
    - restock returned items
  refund_return:
    purpose: Create a completed refund for a RECEIVED return.
    http:
      method: POST
      path: /returns/{return_id}/refund
    contract:
      openapi_operation_id: refund_returns__return_id__refund_post
      summary: Refund a received return
      tags:
      - returns
      parameters:
      - name: return_id
        in: path
        required: true
        schema:
          type: string
          title: Return Id
      request_body: null
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    entities:
    - ReturnRequest
    - Refund
    - Order
    preconditions:
    - return must exist
    - return status must be RECEIVED
    postconditions:
    - refund amount equals sum(unit_price * returned line quantity)
    - Refund status is COMPLETED
    - return status becomes REFUNDED
    - order payment_status becomes REFUNDED if cumulative refunds >= order.total_amount, otherwise PARTIALLY_REFUNDED
    side_effects:
    - creates Refund record
    - creates REFUND_COMPLETED event
    - no external payment processor is called
    errors:
    - RETURN_NOT_FOUND
    - INVALID_RETURN_STATE
    execution:
      effect: financial_simulation
      risk: critical
      confirmation: required
      idempotency: no; after success return state is REFUNDED and repeat call is rejected
    conversation_hints:
    - refund return
    - issue refund
    - refund returned item
  list_refunds:
    purpose: List completed refund records for an order by created_at.
    http:
      method: GET
      path: /orders/{order_id}/refunds
    contract:
      openapi_operation_id: list_refunds_orders__order_id__refunds_get
      summary: List refunds for order
      tags:
      - returns
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          title: Order Id
      request_body: null
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RefundOut'
                title: Response List Refunds Orders  Order Id  Refunds Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    entities:
    - Order
    - Refund
    preconditions:
    - order must exist
    postconditions: []
    side_effects: []
    errors:
    - ORDER_NOT_FOUND
    execution:
      effect: read_only
      risk: low
      confirmation: never
      idempotency: 'yes'
    conversation_hints:
    - show refunds
    - how much has been refunded
workflows:
  create_draft_order:
    goal: Create a modifiable order draft.
    steps:
    - operation: create_order
    - repeat: add_order_item
      until: all desired products are present
    terminal_condition: Order.status == DRAFT
  submit_and_pay_order:
    goal: Move a valid draft to paid state.
    steps:
    - operation: get_order
      reason: inspect current state and items
    - operation: submit_order
      when: status == DRAFT
    - operation: capture_payment
      when: status == SUBMITTED
    terminal_condition: Order.status == PAID and payment_status == CAPTURED
  allocate_order_inventory:
    goal: Reserve inventory for a paid order.
    steps:
    - operation: get_order
    - operation: allocate_inventory
      arguments:
        allow_partial: choose from user intent; true if user permits partial allocation
    terminal_condition: Order.status in [PAID, PARTIALLY_ALLOCATED, ALLOCATED]
  fulfill_order:
    goal: Progress a submitted/paid order toward shipment.
    steps:
    - operation: get_order
    - operation: capture_payment
      when: status == SUBMITTED
    - operation: allocate_inventory
      when: status in [PAID, PARTIALLY_ALLOCATED]
    - operation: get_order
      reason: resolve order_item IDs and allocated quantities
    - operation: create_shipment
      when: allocated unshipped quantity exists
      requires_user_or_policy_input:
      - carrier
      - tracking_number
      - which allocated quantities to ship
    notes:
    - There is no single fulfill endpoint.
    - After a partial shipment the v1 service does not permit new allocation because PARTIALLY_SHIPPED is not an allocation
      state.
  deliver_shipment:
    goal: Record delivery and potentially complete the order.
    steps:
    - operation: get_shipment
    - operation: mark_shipment_delivered
  cancel_unshipped_order:
    goal: Cancel an order before anything ships.
    steps:
    - operation: get_order
      reason: verify shipped quantities/current state
    - operation: cancel_order
      confirmation: required
    alternative: If anything has shipped, do not call cancel_order; after delivery use return_delivered_items.
  return_delivered_items:
    goal: Request a return for delivered eligible quantities.
    steps:
    - operation: get_order
    - operation: list_shipments
      reason: establish delivery context if needed
    - operation: list_returns
      reason: understand existing/pending return context if needed
    - operation: create_return
      confirmation: required
  process_return_to_refund:
    goal: Process an existing return through approval, receipt, and refund.
    steps:
    - operation: get_return
    - operation: approve_return
      when: status == REQUESTED and approval intended
      alternative_operation: reject_return
    - operation: receive_return
      when: status == APPROVED and goods are actually received
    - operation: refund_return
      when: status == RECEIVED
      confirmation: required
    terminal_condition: Return.status == REFUNDED and a Refund exists
  explain_order_state:
    goal: Explain what happened and what can happen next.
    steps:
    - operation: get_order
    - operation: get_order_timeline
    - optional_operation: list_shipments
    - optional_operation: list_returns
    - optional_operation: list_refunds
    execution: read_only
errors:
  format:
    error:
      code: machine-readable stable business code
      message: human-readable explanation
      details: structured operation-specific details
  catalog:
    REQUEST_VALIDATION_ERROR:
      http_status: 422
      category: transport_validation
      meaning: FastAPI/Pydantic rejected request shape or field constraints.
      retryable: after correcting request
    INVALID_CUSTOMER:
      http_status: 400
      category: business_validation
      meaning: Customer does not exist or is inactive.
      retryable: after choosing/creating an active customer
    INVALID_PRODUCT:
      http_status: 400
      category: business_validation
      meaning: Product does not exist or is inactive.
      retryable: after choosing an active product
    DUPLICATE_SHIPMENT_LINE:
      http_status: 400
      category: business_validation
      meaning: Same order item appears more than once in one shipment request.
      retryable: after merging/removing duplicate lines
    ORDER_NOT_FOUND:
      http_status: 404
      category: not_found
      meaning: Order ID does not exist.
      retryable: after resolving a valid order
    ORDER_ITEM_NOT_FOUND:
      http_status: 404
      category: not_found
      meaning: Order item does not belong to the referenced order.
      retryable: after resolving a valid item
    PRODUCT_NOT_FOUND:
      http_status: 404
      category: not_found
      meaning: Product SKU does not exist.
      retryable: after resolving a valid SKU
    SHIPMENT_NOT_FOUND:
      http_status: 404
      category: not_found
      meaning: Shipment ID does not exist.
      retryable: after resolving a valid shipment
    RETURN_NOT_FOUND:
      http_status: 404
      category: not_found
      meaning: Return ID does not exist.
      retryable: after resolving a valid return
    EMAIL_ALREADY_EXISTS:
      http_status: 409
      category: conflict
      meaning: Customer email is already in use.
      retryable: with a different email
    SKU_ALREADY_EXISTS:
      http_status: 409
      category: conflict
      meaning: Product SKU already exists.
      retryable: with a different SKU or use existing product
    INVENTORY_BELOW_RESERVED:
      http_status: 409
      category: business_rule
      meaning: Inventory adjustment would make stock_on_hand lower than reserved_stock.
      retryable: with a smaller negative adjustment or after reservations are consumed/released
    ORDER_NOT_EDITABLE:
      http_status: 409
      category: business_rule
      meaning: Line-item editing is allowed only in DRAFT.
      retryable: not without creating/using a draft order
    CURRENCY_MISMATCH:
      http_status: 409
      category: business_rule
      meaning: Product currency differs from order currency.
      retryable: with a matching-currency product/order
    INVALID_ORDER_STATE:
      http_status: 409
      category: state_machine
      meaning: Requested operation is not allowed from the current Order.status.
      retryable: after inspecting state and performing required preceding transition
    EMPTY_ORDER:
      http_status: 409
      category: business_rule
      meaning: Order has no items and cannot be submitted.
      retryable: after adding at least one item
    INVALID_ORDER_TOTAL:
      http_status: 409
      category: business_rule
      meaning: Order total must be greater than zero to submit.
      retryable: after correcting order contents
    PAYMENT_ALREADY_PROCESSED:
      http_status: 409
      category: state_machine
      meaning: Payment status is not NONE; capture cannot be repeated.
      retryable: no for the same payment state
    INSUFFICIENT_INVENTORY:
      http_status: 409
      category: inventory
      meaning: At least one required item lacks enough available stock when allow_partial=false.
      details: details.shortages entries contain sku, required, available
      retryable: after restock, order change, or with allow_partial=true
    QUANTITY_NOT_ALLOCATED:
      http_status: 409
      category: inventory
      meaning: Shipment requests more quantity than remains allocated and unshipped.
      retryable: with a lower quantity or after valid allocation
    ORDER_ALREADY_SHIPPED:
      http_status: 409
      category: state_machine
      meaning: At least one order quantity has shipped; full cancellation is forbidden.
      retryable: use return workflow after delivery
    ORDER_ALREADY_DELIVERED:
      http_status: 409
      category: state_machine
      meaning: Delivered orders cannot be cancelled.
      retryable: use return workflow
      note: Likely shadowed by ORDER_ALREADY_SHIPPED for consistent delivered orders.
    PAYMENT_NOT_ELIGIBLE:
      http_status: 409
      category: business_rule
      meaning: Order payment status is not CAPTURED or PARTIALLY_REFUNDED; return cannot be requested.
      retryable: only when payment state becomes eligible
    PRODUCT_NOT_RETURNABLE:
      http_status: 409
      category: return_policy
      meaning: Product is explicitly non-returnable.
      retryable: no for this product
    RETURN_QUANTITY_EXCEEDED:
      http_status: 409
      category: return_policy
      meaning: Requested return quantity exceeds delivered quantity still eligible for return.
      details: delivered, already_returned, pending, available
      retryable: with quantity <= available
    NOTHING_DELIVERED:
      http_status: 409
      category: return_policy
      meaning: No delivered quantity exists for the item.
      retryable: after delivery
    RETURN_WINDOW_EXPIRED:
      http_status: 409
      category: return_policy
      meaning: Return requested more than 30 days after latest delivery for the item.
      retryable: no under current v1 policy
    INVALID_RETURN_STATE:
      http_status: 409
      category: state_machine
      meaning: Return operation is not permitted from current ReturnStatus.
      retryable: after inspecting required return lifecycle
    RESERVATION_INCONSISTENCY:
      http_status: 500
      category: internal_invariant
      meaning: OrderItem allocated quantity has no matching ACTIVE reservation quantity.
      retryable: do not automatically retry; surface as service invariant failure
business_events:
  ORDER_CREATED: Draft order created.
  ITEM_ADDED: Quantity added to an order item.
  ITEM_REMOVED: Draft order item removed.
  ORDER_SUBMITTED: Draft submitted with captured total.
  PAYMENT_CAPTURED: Simulated payment captured.
  INVENTORY_RESERVED: Inventory quantity reserved.
  ITEM_SHIPPED: Allocated item quantity shipped.
  SHIPMENT_CREATED: Shipment record created.
  SHIPMENT_DELIVERED: Shipment marked delivered.
  ORDER_DELIVERED: Order fulfillment completed because all required units and shipments are delivered.
  ORDER_CANCELLED: Order cancelled with supplied reason.
  RETURN_REQUESTED: Return request created.
  RETURN_APPROVED: Return approved.
  RETURN_REJECTED: Return rejected with reason.
  RETURN_RECEIVED: Return received and inventory restocked.
  REFUND_COMPLETED: Cancellation or return refund completed.
conversation:
  primary_intents:
    service_knowledge:
    - what does this service do
    - what endpoints exist
    - what can I do with orders
    - explain return rules
    catalog_queries:
    - list customers
    - list products
    - check inventory
    order_queries:
    - show order
    - latest order
    - why is my order in this state
    - what has shipped
    order_commands:
    - create order
    - add/remove item
    - submit
    - capture payment
    - allocate
    - cancel
    fulfillment_commands:
    - ship allocated items
    - mark shipment delivered
    return_commands:
    - request return
    - approve/reject return
    - receive return
    - refund return
  terminology:
    order:
      synonyms:
      - purchase
      - customer order
    order_item:
      synonyms:
      - line item
      - item in the order
      - order line
    product:
      synonyms:
      - SKU
      - catalog item
    inventory_allocation:
      synonyms:
      - reserve inventory
      - reserve stock
      - allocate stock
    shipment:
      synonyms:
      - package
      - fulfillment shipment
    return_request:
      synonyms:
      - return
      - RMA-like request
    refund:
      synonyms:
      - money back
      - reimbursement
      note: simulated; no external payment network
  entity_resolution:
    explicit_id_prefixes:
      CUS-: Customer
      ORD-: Order
      ITM-: OrderItem
      RSV-: InventoryReservation
      SHP-: Shipment
      RET-: ReturnRequest
      RFD-: Refund
      EVT-: OrderEvent
    latest_order:
      phrases:
      - my last order
      - latest order
      - most recent order
      plan:
        operation: list_orders
        filter: customer_id if known from conversational identity/context
        ordering: API returns created_at descending
        select: first result
      ambiguity: If customer identity is not established and multiple customers exist, ask which customer; do not assume demo
        identity.
    current_context:
      phrases:
      - it
      - this order
      - that order
      - this shipment
      - that return
      - the item
      strategy: resolve against most recently referenced compatible entity in conversation state; if multiple compatible entities
        remain, ask for clarification.
    product_by_name:
      strategy: use list_products or known returned catalog records to map user-facing product name to SKU; never invent a
        SKU.
    order_item_by_product:
      strategy: get_order, then match product_name or sku among order.items; if more than one candidate is plausible, ask
        for clarification.
  planning_rules:
  - Never invent entity IDs, SKUs, carrier names, tracking numbers, or current resource state.
  - Use read operations to resolve references and inspect state before executing state-dependent operations when required
    context is absent.
  - Prefer canonical operation IDs in this digest rather than constructing arbitrary HTTP requests.
  - When an operation fails with a stable business error, explain the business meaning and suggest only alternatives supported
    by this digest.
  - Do not treat seeded demo data as guaranteed runtime state; retrieve current data from the API.
execution_policy:
  principle: LLM selects canonical operations and arguments; deterministic executor constructs and sends only allowlisted
    HTTP calls from operations section.
  arbitrary_http_generation_allowed: false
  unknown_operation_behavior: refuse execution and explain that the service digest does not define that operation
  confirmation_levels:
    never: May execute after clear user intent without a second confirmation.
    conditional: Executor/policy may require confirmation when scope, quantity, or target is inferred rather than explicit.
    required: Obtain explicit confirmation after presenting the concrete target and material effect immediately before execution.
  hard_safety_rules:
  - Never expose or infer Kubernetes Secret values or database credentials.
  - Never bypass operation preconditions described in this digest.
  - Never transform a failed destructive operation into a different destructive operation without user consent.
  - For confirmation-required operations, confirmation must apply to resolved concrete IDs/quantities, not a vague earlier
    intent.
  - Treat refund operations as financial-impact operations even though this demo implementation is simulated.
api_contract:
  openapi_version: 3.1.0
  service_info:
