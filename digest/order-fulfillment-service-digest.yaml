service:
  id: order-fulfillment-service
  name: Order Fulfillment Service
  version: 1.0.0
  domain: ecommerce-order-fulfillment
  purpose: Manage the business lifecycle of customer orders from draft creation through payment, inventory reservation, partial
    or complete shipment, delivery, cancellation, return, inventory restocking, and refund.
  capabilities:
  - customer and product catalog
  - draft order creation and editing
  - order submission
  - simulated payment capture
  - physical/reserved inventory
  - full or partial inventory allocation
  - full or partial shipment
  - delivery tracking
  - pre-shipment cancellation
  - automatic cancellation refund
  - return eligibility and 30-day window
  - return approval/rejection
  - return receiving and restocking
  - partial/full simulated refunds
  - business-event timeline
  non_goals:
  - Real payment-network integration
  - Carrier API integration
  - Customer authentication
  - Tax calculation
  important_concepts:
  - Orders are mutable only while DRAFT.
  - Payment is simulated but has explicit capture and refund states.
  - Inventory allocation reserves stock before shipment.
  - Partial allocation and partial shipment are supported.
  - Full cancellation is forbidden once any item has shipped.
  - Returns are limited to delivered, returnable quantities and a 30-day window.
  ownership:
    team: Commerce Platform
runtime_interface:
  protocol: HTTP REST
  application_port: 8080
  health_endpoint: /health
  swagger_ui: /docs
  runtime_openapi: /openapi.json
  authentication:
    implemented: false
    note: v1 intentionally has no customer authentication/authorization; the conversational layer must not imply identity-based
      access control exists.
  known_kubernetes_binding:
    namespace: order-fulfillment
    service_name: order-fulfillment-service
    service_type: NodePort
    service_port: 8080
    node_port: 30080
    cluster_internal_base_url: http://order-fulfillment-service.order-fulfillment.svc:8080
    lab_node_base_url: http://192.168.253.10:30080
    binding_is_environment_specific: true
  database:
    engine: PostgreSQL 16
    service_name: postgres
    port: 5432
    persistence: emptyDir in supplied lab manifest; data resets when PostgreSQL pod storage is recreated
    credentials_in_digest: false
  deployment:
    language: Python 3.12
    framework: FastAPI
    orm: SQLAlchemy 2
    container_image: order-fulfillment-service:1.0.0
domain:
  entities:
    Customer:
      description: Customer that owns orders.
      identity:
        field: id
        type: string
        generated_format: CUS-<10 uppercase hex>; deterministic demo IDs also exist
      fields:
        id:
          type: string
          required: true
        name:
          type: string
          max_length: 120
        email:
          type: string
          max_length: 200
          unique: true
        active:
          type: boolean
          default: true
        created_at:
          type: datetime
          timezone_aware: true
      relationships:
        orders:
          entity: Order
          cardinality: one_to_many
    Product:
      description: Catalog product that also owns aggregate physical/reserved inventory counters.
      identity:
        field: sku
        type: string
      fields:
        sku:
          type: string
          max_length: 40
        name:
          type: string
          max_length: 160
        unit_price:
          type: decimal
          precision: 12,2
        currency:
          type: string
          length: 3
          default: USD
        stock_on_hand:
          type: integer
          default: 0
        reserved_stock:
          type: integer
          default: 0
        available_stock:
          type: integer
          computed: stock_on_hand - reserved_stock
        returnable:
          type: boolean
          default: true
        active:
          type: boolean
          default: true
    Order:
      description: Customer purchase aggregate and primary fulfillment lifecycle entity.
      identity:
        field: id
        type: string
        generated_format: ORD-<10 uppercase hex>
      fields:
        id:
          type: string
        customer_id:
          type: string
          references: Customer.id
        status:
          type: OrderStatus
          default: DRAFT
        payment_status:
          type: PaymentStatus
          default: NONE
        currency:
          type: string
          length: 3
          default: USD
        shipping_address:
          type: string
          max_length: 300
        total_amount:
          type: decimal
          precision: 12,2
          default: '0.00'
          calculation: sum(item.unit_price * (item.quantity - item.cancelled_qty)) when recalculated
        created_at:
          type: datetime
          timezone_aware: true
        updated_at:
          type: datetime
          timezone_aware: true
      relationships:
        customer:
          entity: Customer
          cardinality: many_to_one
        items:
          entity: OrderItem
          cardinality: one_to_many
        shipments:
          entity: Shipment
          cardinality: one_to_many
        returns:
          entity: ReturnRequest
          cardinality: one_to_many
        refunds:
          entity: Refund
          cardinality: one_to_many
        events:
          entity: OrderEvent
          cardinality: one_to_many
    OrderItem:
      description: Snapshot-priced product line within an order; tracks allocation, shipment, cancellation, and returned quantities.
      identity:
        field: id
        type: string
        generated_format: ITM-<10 uppercase hex>
      fields:
        id:
          type: string
        order_id:
          type: string
          references: Order.id
        sku:
          type: string
          references: Product.sku
        product_name:
          type: string
          snapshot: true
        quantity:
          type: integer
        unit_price:
          type: decimal
          snapshot: true
        allocated_qty:
          type: integer
          default: 0
        shipped_qty:
          type: integer
          default: 0
        cancelled_qty:
          type: integer
          default: 0
        returned_qty:
          type: integer
          default: 0
      derived_quantities:
        unallocated_required: quantity - cancelled_qty - allocated_qty
        shippable: allocated_qty - shipped_qty
      relationships:
        order:
          entity: Order
          cardinality: many_to_one
        product:
          entity: Product
          cardinality: many_to_one
        reservations:
          entity: InventoryReservation
          cardinality: one_to_many
    InventoryReservation:
      description: Reservation of product stock for a specific order item; consumed during shipment or released during cancellation.
      identity:
        field: id
        type: string
        generated_format: RSV-<10 uppercase hex>
      fields:
        id:
          type: string
        order_item_id:
          type: string
          references: OrderItem.id
        sku:
          type: string
          references: Product.sku
        quantity:
          type: integer
        remaining_quantity:
          type: integer
        status:
          type: ReservationStatus
          default: ACTIVE
        created_at:
          type: datetime
    Shipment:
      description: Physical/digital fulfillment shipment for one order.
      identity:
        field: id
        type: string
        generated_format: SHP-<10 uppercase hex>
      fields:
        id:
          type: string
        order_id:
          type: string
          references: Order.id
        carrier:
          type: string
          max_length: 80
        tracking_number:
          type: string
          max_length: 100
        status:
          type: ShipmentStatus
          default: SHIPPED
        shipped_at:
          type: datetime
        delivered_at:
          type: datetime|null
      relationships:
        order:
          entity: Order
          cardinality: many_to_one
        items:
          entity: ShipmentItem
          cardinality: one_to_many
    ShipmentItem:
      description: Quantity of an OrderItem included in a Shipment.
      identity:
        field: id
        type: string
        generated_format: SIT-<10 uppercase hex>
      fields:
        id:
          type: string
        shipment_id:
          type: string
          references: Shipment.id
        order_item_id:
          type: string
          references: OrderItem.id
        quantity:
          type: integer
    ReturnRequest:
      description: Return authorization lifecycle for one or more delivered order-item quantities.
      identity:
        field: id
        type: string
        generated_format: RET-<10 uppercase hex>
      fields:
        id:
          type: string
        order_id:
          type: string
          references: Order.id
        status:
          type: ReturnStatus
          default: REQUESTED
        reason:
          type: string
          max_length: 300
        requested_at:
          type: datetime
        approved_at:
          type: datetime|null
        received_at:
          type: datetime|null
      relationships:
        order:
          entity: Order
          cardinality: many_to_one
        items:
          entity: ReturnItem
          cardinality: one_to_many
    ReturnItem:
      description: Quantity of an OrderItem included in a return request.
      identity:
        field: id
        type: string
        generated_format: RIT-<10 uppercase hex>
      fields:
        id:
          type: string
        return_id:
          type: string
          references: ReturnRequest.id
        order_item_id:
          type: string
          references: OrderItem.id
        quantity:
          type: integer
    Refund:
      description: Completed simulated refund associated with an order and optionally a return.
      identity:
        field: id
        type: string
        generated_format: RFD-<10 uppercase hex>
      fields:
        id:
          type: string
        order_id:
          type: string
          references: Order.id
        return_id:
          type: string|null
          references: ReturnRequest.id
        amount:
          type: decimal
          precision: 12,2
        currency:
          type: string
          length: 3
        status:
          type: RefundStatus
          default: COMPLETED
        reason:
          type: string
          max_length: 300
        created_at:
          type: datetime
    OrderEvent:
      description: Chronological audit/business event for an order.
      identity:
        field: id
        type: string
        generated_format: EVT-<10 uppercase hex>
      fields:
        id:
          type: string
        order_id:
          type: string
          references: Order.id
        event_type:
          type: string
          max_length: 80
        description:
          type: string
        created_at:
          type: datetime
  enums:
    OrderStatus:
    - DRAFT
    - SUBMITTED
    - PAID
    - PARTIALLY_ALLOCATED
    - ALLOCATED
    - PARTIALLY_SHIPPED
    - SHIPPED
    - DELIVERED
    - CANCELLED
    PaymentStatus:
    - NONE
    - CAPTURED
    - PARTIALLY_REFUNDED
    - REFUNDED
    ReservationStatus:
    - ACTIVE
    - CONSUMED
    - RELEASED
    ShipmentStatus:
    - SHIPPED
    - DELIVERED
    ReturnStatus:
    - REQUESTED
    - APPROVED
    - RECEIVED
    - REFUNDED
    - REJECTED
    RefundStatus:
    - COMPLETED
  relationship_overview:
  - Customer -> Order
  - Order -> OrderItem -> Product
  - OrderItem -> InventoryReservation
  - Order -> Shipment -> ShipmentItem -> OrderItem
  - Order -> ReturnRequest -> ReturnItem -> OrderItem
  - Order -> Refund
  - Order -> OrderEvent
state_machines:
  order_lifecycle:
    entity: Order
    state_field: status
    states:
    - DRAFT
    - SUBMITTED
    - PAID
    - PARTIALLY_ALLOCATED
    - ALLOCATED
    - PARTIALLY_SHIPPED
    - SHIPPED
    - DELIVERED
    - CANCELLED
    transitions:
    - from: DRAFT
      to: SUBMITTED
      trigger: submit_order
    - from: SUBMITTED
      to: PAID
      trigger: capture_payment
    - from: PAID
      to:
      - PAID
      - PARTIALLY_ALLOCATED
      - ALLOCATED
      trigger: allocate_inventory
      note: PAID remains when zero units can be allocated with allow_partial=true
    - from: PARTIALLY_ALLOCATED
      to:
      - PARTIALLY_ALLOCATED
      - ALLOCATED
      trigger: allocate_inventory
    - from:
      - ALLOCATED
      - PARTIALLY_ALLOCATED
      - PARTIALLY_SHIPPED
      to:
      - PARTIALLY_SHIPPED
      - SHIPPED
      trigger: create_shipment
    - from: SHIPPED
      to: DELIVERED
      trigger: mark_shipment_delivered
      condition: all required units shipped and every shipment DELIVERED
    - from:
      - DRAFT
      - SUBMITTED
      - PAID
      - PARTIALLY_ALLOCATED
      - ALLOCATED
      to: CANCELLED
      trigger: cancel_order
      condition: no shipped_qty > 0
    important_limitations:
    - allocate_inventory is not allowed after order status becomes PARTIALLY_SHIPPED; additional future allocation after a
      partial shipment is therefore not supported by v1.
  payment_lifecycle:
    entity: Order
    state_field: payment_status
    states:
    - NONE
    - CAPTURED
    - PARTIALLY_REFUNDED
    - REFUNDED
    transitions:
    - from: NONE
      to: CAPTURED
      trigger: capture_payment
    - from: CAPTURED
      to: REFUNDED
      trigger: cancel_order when payment captured
    - from:
      - CAPTURED
      - PARTIALLY_REFUNDED
      to:
      - PARTIALLY_REFUNDED
      - REFUNDED
      trigger: refund_return
      condition: based on cumulative refund amount compared with order.total_amount
  reservation_lifecycle:
    entity: InventoryReservation
    state_field: status
    states:
    - ACTIVE
    - CONSUMED
    - RELEASED
    transitions:
    - from: ACTIVE
      to: CONSUMED
      trigger: create_shipment
      condition: remaining_quantity reaches zero
    - from: ACTIVE
      to: RELEASED
      trigger: cancel_order
      condition: active remaining quantity > 0
  shipment_lifecycle:
    entity: Shipment
    state_field: status
    states:
    - SHIPPED
    - DELIVERED
    transitions:
    - from: SHIPPED
      to: DELIVERED
      trigger: mark_shipment_delivered
  return_lifecycle:
    entity: ReturnRequest
    state_field: status
    states:
    - REQUESTED
    - APPROVED
    - RECEIVED
    - REFUNDED
    - REJECTED
    transitions:
    - from: REQUESTED
      to: APPROVED
      trigger: approve_return
    - from: REQUESTED
      to: REJECTED
      trigger: reject_return
    - from: APPROVED
      to: RECEIVED
      trigger: receive_return
    - from: RECEIVED
      to: REFUNDED
      trigger: refund_return
business_rules:
  BR-CUSTOMER-001:
    name: Active customer required for order creation
    rule: create_order requires an existing Customer with active=true
    operations:
    - create_order
    errors:
    - INVALID_CUSTOMER
  BR-CUSTOMER-002:
    name: Customer email uniqueness
    rule: create_customer rejects an email already present in customers
    operations:
    - create_customer
    errors:
    - EMAIL_ALREADY_EXISTS
  BR-PRODUCT-001:
    name: Product SKU uniqueness
    rule: create_product rejects an existing SKU
    operations:
    - create_product
    errors:
    - SKU_ALREADY_EXISTS
  BR-INVENTORY-001:
    name: Reserved stock floor
    rule: physical stock may not be adjusted below reserved_stock
    operations:
    - adjust_inventory
    errors:
    - INVENTORY_BELOW_RESERVED
  BR-ORDER-001:
    name: Draft-only editing
    rule: order items can be added or removed only while Order.status == DRAFT
    operations:
    - add_order_item
    - remove_order_item
    errors:
    - ORDER_NOT_EDITABLE
  BR-ORDER-002:
    name: Currency consistency
    rule: Product.currency must equal Order.currency when adding an item
    operations:
    - add_order_item
    errors:
    - CURRENCY_MISMATCH
  BR-ORDER-003:
    name: Submit non-empty positive order
    rule: Only a DRAFT order containing at least one item and total_amount > 0 may be submitted
    operations:
    - submit_order
    errors:
    - INVALID_ORDER_STATE
    - EMPTY_ORDER
    - INVALID_ORDER_TOTAL
  BR-PAYMENT-001:
    name: Payment capture state
    rule: Payment capture requires Order.status == SUBMITTED and payment_status == NONE
    operations:
    - capture_payment
    errors:
    - INVALID_ORDER_STATE
    - PAYMENT_ALREADY_PROCESSED
  BR-ALLOC-001:
    name: Allocation state
    rule: Inventory allocation is allowed only for PAID or PARTIALLY_ALLOCATED orders
    operations:
    - allocate_inventory
    errors:
    - INVALID_ORDER_STATE
  BR-ALLOC-002:
    name: Partial allocation policy
    rule: allow_partial=false rejects the full allocation attempt on any shortage; allow_partial=true reserves available quantities
    operations:
    - allocate_inventory
    errors:
    - INSUFFICIENT_INVENTORY
  BR-SHIP-001:
    name: Ship only allocated quantity
    rule: A shipment line quantity cannot exceed OrderItem.allocated_qty - OrderItem.shipped_qty
    operations:
    - create_shipment
    errors:
    - QUANTITY_NOT_ALLOCATED
  BR-SHIP-002:
    name: No duplicate shipment lines
    rule: An order_item_id may appear at most once in one shipment request
    operations:
    - create_shipment
    errors:
    - DUPLICATE_SHIPMENT_LINE
  BR-SHIP-003:
    name: Shipment consumes inventory
    rule: Shipping consumes active reservations FIFO, reduces reserved_stock and stock_on_hand, and increments shipped_qty
    operations:
    - create_shipment
  BR-DELIVERY-001:
    name: Order delivery completion
    rule: Order becomes DELIVERED only when all non-cancelled required quantity is shipped and every shipment is DELIVERED
    operations:
    - mark_shipment_delivered
  BR-CANCEL-001:
    name: No full cancellation after shipment
    rule: Full cancellation is forbidden once any item shipped_qty > 0
    operations:
    - cancel_order
    errors:
    - ORDER_ALREADY_SHIPPED
  BR-CANCEL-002:
    name: Cancellation releases reservations
    rule: Cancellation releases every active remaining inventory reservation and reduces reserved_stock and allocated_qty
      accordingly
    operations:
    - cancel_order
  BR-CANCEL-003:
    name: Paid cancellation refunds
    rule: Cancelling an unshipped order with payment_status CAPTURED creates a full refund and sets payment_status REFUNDED
    operations:
    - cancel_order
  BR-RETURN-001:
    name: Paid order return eligibility
    rule: Returns require order payment_status CAPTURED or PARTIALLY_REFUNDED
    operations:
    - create_return
    errors:
    - PAYMENT_NOT_ELIGIBLE
  BR-RETURN-002:
    name: Returnable product
    rule: Product.returnable must be true
    operations:
    - create_return
    errors:
    - PRODUCT_NOT_RETURNABLE
  BR-RETURN-003:
    name: Delivered unreturned quantity limit
    rule: requested quantity <= delivered quantity - returned_qty - pending REQUESTED/APPROVED return quantity
    operations:
    - create_return
    errors:
    - RETURN_QUANTITY_EXCEEDED
  BR-RETURN-004:
    name: Thirty-day return window
    rule: Return must be requested within 30 days of latest delivered_at for a delivered shipment containing that item
    operations:
    - create_return
    errors:
    - RETURN_WINDOW_EXPIRED
  BR-RETURN-005:
    name: Return approval/rejection state
    rule: Only REQUESTED returns can be approved or rejected
    operations:
    - approve_return
    - reject_return
    errors:
    - INVALID_RETURN_STATE
  BR-RETURN-006:
    name: Receive approved return
    rule: Only APPROVED returns can be received; receipt increments returned_qty and Product.stock_on_hand
    operations:
    - receive_return
    errors:
    - INVALID_RETURN_STATE
  BR-REFUND-001:
    name: Refund received return
    rule: Only RECEIVED returns can be refunded; refund amount equals snapshot unit_price * returned quantity
    operations:
    - refund_return
    errors:
    - INVALID_RETURN_STATE
  BR-REFUND-002:
    name: Payment status from cumulative refunds
    rule: After return refund, payment_status is REFUNDED when cumulative refunds >= order.total_amount; otherwise PARTIALLY_REFUNDED
    operations:
    - refund_return
