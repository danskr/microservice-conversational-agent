  create_customer:
    purpose: Create an active customer with a unique email address.
    http:
      method: POST
      path: /customers
    contract:
      openapi_operation_id: create_customer_customers_post
      summary: Create customer
      tags:
      - catalog
      parameters: []
      request_body:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    entities:
    - Customer
    preconditions:
    - email must not already exist
    - name and email must satisfy request validation
    postconditions:
    - new customer is active by model default
    side_effects:
    - inserts a customer record
    errors:
    - EMAIL_ALREADY_EXISTS
    - REQUEST_VALIDATION_ERROR
