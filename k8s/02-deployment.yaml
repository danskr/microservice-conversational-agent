apiVersion: apps/v1
kind: Deployment
metadata:
  name: conversational-agent
  namespace: conversational-layer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conversational-agent
  template:
    metadata:
      labels:
        app: conversational-agent
    spec:
      containers:
        - name: agent
          image: microservice-conversational-agent:1.0.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 2024
          envFrom:
            - configMapRef:
                name: conversational-agent-config
            - secretRef:
                name: conversational-agent-secrets
          readinessProbe:
            httpGet:
              path: /ok
              port: http
            initialDelaySeconds: 8
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /ok
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "2"
              memory: "1536Mi"
          volumeMounts:
            - name: langgraph-state
              mountPath: /app/.langgraph_api
      volumes:
        - name: langgraph-state
          emptyDir: {}
